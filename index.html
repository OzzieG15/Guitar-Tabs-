<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0F172A" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="image_4a623bff.jpg" type="image/jpeg" />
<link rel="apple-touch-icon" href="image_4a623bff.jpg" />

 <title>Ozzie's Play App</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: #020617; color: #F8FAFC;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100%; display: flex; justify-content: center; align-items: center; overflow: hidden;
  }
  #app {
    width: 100%; max-width: 480px; height: 100%; max-height: 760px;
    background: #0F172A; display: flex; flex-direction: column;
    overflow: hidden; position: relative;
  }
  .hidden { display: none !important; }
  #welcomeScreen { display: flex; flex-direction: column; height: 100%; background: #0F172A; }
  .w-header { padding: 14px 16px 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .w-title { font-size: 18px; font-weight: 700; color: #F8FAFC; line-height: 1.2; }
  .w-sub { font-size: 12px; color: #94A3B8; margin-top: 2px; }
  .btn-import {
    background: #1E293B; color: #38BDF8; border: 1px solid #334155;
    padding: 7px 11px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  .w-controls { padding: 0 16px 10px; display: flex; flex-direction: column; gap: 8px; }
  .search-input {
    width: 100%; background: #1E293B; border: 1px solid #334155; color: #F8FAFC;
    padding: 9px 12px; border-radius: 8px; font-size: 14px; outline: none;
  }
  .search-input::placeholder { color: #64748B; }
  .tabs { display: flex; background: #1E293B; padding: 3px; border-radius: 8px; gap: 3px; }
  .tab {
    flex: 1; text-align: center; padding: 6px 4px; font-size: 12px; font-weight: 600;
    color: #94A3B8; border-radius: 6px; cursor: pointer; border: none; background: transparent;
  }
  .tab.active { background: #2563EB; color: #FFFFFF; }
  #songList {
    flex: 1; min-height: 0; background: #000000; overflow-y: auto;
    -webkit-overflow-scrolling: touch; touch-action: pan-y; padding: 8px 12px;
  }
  .song-item {
    padding: 11px 12px; border-bottom: 1px solid #1E293B; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .song-item:active { background: #0F172A; }
  .song-title { font-size: 15px; font-weight: 600; color: #F8FAFC; }
  .song-artist { font-size: 12px; color: #94A3B8; margin-top: 2px; }
  .song-meta { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .badge-lang { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #1E293B; color: #94A3B8; font-weight: 600; }
  .badge-key { font-size: 11px; padding: 2px 7px; border-radius: 999px; border: 1px solid #FACC15; color: #FACC15; font-weight: 700; }
  .artist-group { border-bottom: 1px solid #1E293B; }
  .artist-header { padding: 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; background: #090D16; }
  .artist-name { font-size: 15px; font-weight: 700; color: #F8FAFC; }
  .artist-count { font-size: 12px; background: #1E293B; color: #38BDF8; padding: 2px 8px; border-radius: 999px; font-weight: 700; }
  .artist-songs { padding-left: 10px; background: #000000; }
  #playerScreen { display: flex; flex-direction: column; height: 100%; background: #0F172A; }
  .p-top { padding: 10px 14px 6px; display: flex; justify-content: space-between; align-items: center; gap: 8px; background: #0F172A; }
  .p-song-btn {
    background: transparent; border: none; color: #F8FAFC; font-size: 15px; font-weight: 700;
    text-align: left; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .p-key-pill {
    background: #1E293B; border: 1px solid #FACC15; color: #FACC15; font-size: 12px; font-weight: 800;
    padding: 4px 10px; border-radius: 999px; white-space: nowrap; flex-shrink: 0; cursor: pointer;
  }
  .p-sec-bar { padding: 4px 14px 8px; display: flex; justify-content: space-between; align-items: center; min-height: 28px; background: #0F172A; }
  .countdown-pill {
    background: rgba(239, 68, 68, 0.16); border: 1px solid #EF4444; color: #FCA5A5;
    font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px;
  }
  .sec-label { font-size: 13px; font-weight: 700; color: #F8FAFC; margin-left: auto; }
  #viewport {
    flex: 1; min-height: 0; background: #000000; overflow-y: auto;
    -webkit-overflow-scrolling: touch; touch-action: pan-y; padding: 14px 14px 10px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .row { display: flex; align-items: flex-start; gap: 10px; transition: opacity 0.2s ease; }
  .active-bar { width: 4px; min-height: 44px; background: #3B82F6; border-radius: 2px; flex-shrink: 0; margin-top: 2px; }
  .active-bar.spacer { background: transparent; }
  .row-content { flex: 1; min-width: 0; }
  .lyric-text { font-size: 24px; font-weight: 700; line-height: 1.25; word-wrap: break-word; }
  .chord-row { display: flex; flex-wrap: nowrap; gap: 8px; margin-top: 6px; overflow: hidden; }
  .chord-pill {
    background: linear-gradient(180deg, #3B82F6 0%, #2563EB 100%);
    color: #FFFFFF; font-size: 13px; font-weight: 800; padding: 2px 9px; border-radius: 6px; white-space: nowrap;
  }
  .op-0 { opacity: 1.0; color: #FFFFFF; }
  .op-1 { opacity: 0.72; color: #CBD5E1; }
  .op-2 { opacity: 0.48; color: #94A3B8; }
  .op-3 { opacity: 0.28; color: #64748B; }
  .p-footer { background: #0F172A; padding: 8px 12px 10px; display: flex; flex-direction: column; gap: 8px; }
  .f-row1 { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .btn-play { background: #2563EB; color: #FFFFFF; border: none; padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .btn-restart { background: #1E293B; color: #E2E8F0; border: 1px solid #334155; padding: 8px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .timer { font-size: 13px; font-weight: 700; color: #CBD5E1; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .speed-select { background: #1E293B; color: #F8FAFC; border: 1px solid #334155; padding: 7px 8px; border-radius: 8px; font-size: 13px; font-weight: 700; outline: none; }
  .f-row2 { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .f-row2::-webkit-scrollbar { display: none; }
  .sec-pill {
    flex: 1 0 calc(33.333% - 4px); min-width: calc(33.333% - 4px);
    background: #1E293B; color: #94A3B8; border: none; padding: 8px 6px;
    border-radius: 8px; font-size: 12px; font-weight: 700; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
  }
  .sec-pill.active { background: #2563EB; color: #FFFFFF; }
  #importModal {
    position: absolute; inset: 0; background: rgba(2,6,23,0.97); z-index: 50;
    display: flex; flex-direction: column; padding: 14px; gap: 8px;
  }
  .m-head { display: flex; justify-content: space-between; align-items: center; }
  .m-title { font-size: 16px; font-weight: 700; color: #F8FAFC; }
  .m-close { background: #1E293B; color: #94A3B8; border: none; padding: 5px 10px; border-radius: 6px; font-weight: 700; cursor: pointer; }
    #chordModal {
    position: absolute; inset: 0; background: rgba(2,6,23,0.92); z-index: 60;
    display: flex; justify-content: center; align-items: center; padding: 20px;
  }
  .c-card {
    background: #0F172A; border: 1px solid #334155; border-radius: 16px;
    padding: 18px 20px; width: 100%; max-width: 280px; text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.85);
  }
  .c-title { font-size: 26px; font-weight: 800; color: #FACC15; margin-bottom: 4px; }
  .c-sub { font-size: 12px; color: #94A3B8; margin-bottom: 12px; }
  .c-close {
    margin-top: 12px; width: 100%; background: #2563EB; color: #FFFFFF; border: none;
    padding: 10px; border-radius: 9px; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .c-card svg { display: block; width: 190px; height: 195px; margin: 4px auto 0; }

 .m-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .m-input { flex: 1; min-width: 85px; background: #1E293B; border: 1px solid #334155; color: #F8FAFC; padding: 8px 10px; border-radius: 7px; font-size: 13px; }
  .chip-bar { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .chip-bar::-webkit-scrollbar { display: none; }
  .chip-btn { background: #1E293B; border: 1px solid #3B82F6; color: #93C5FD; padding: 5px 9px; border-radius: 6px; font-size: 12px; font-weight: 700; white-space: nowrap; cursor: pointer; }
  .chip-btn.sec { border-color: #FACC15; color: #FDE047; }
  .m-area { flex: 1; background: #000000; border: 1px solid #334155; color: #F8FAFC; padding: 10px; border-radius: 8px; font-size: 13px; font-family: monospace; resize: none; }
  .m-save { background: #2563EB; color: #FFFFFF; border: none; padding: 11px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
  #installBanner {
    margin: 0 16px 8px; padding: 8px 12px; border-radius: 10px;
    background: linear-gradient(90deg, #1E293B 0%, #172554 100%);
    border: 1px solid #3B82F6; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .ib-text { font-size: 12px; color: #E2E8F0; font-weight: 600; line-height: 1.3; }
  .ib-btn {
    background: #2563EB; color: #FFFFFF; border: none; padding: 6px 12px;
    border-radius: 7px; font-size: 12px; font-weight: 800; white-space: nowrap; cursor: pointer;
  }
  .ib-x { background: transparent; border: none; color: #94A3B8; font-size: 14px; font-weight: 700; cursor: pointer; padding: 2px 4px; }

</style>
</head>
<body>
<div id="app">
  <div id="welcomeScreen">
    <div class="w-header">
      <div>
        <div class="w-title">Ozzie's Play App</div>
        <div class="w-sub" id="songCountSub">Select a song to start</div>
      </div>
      <button class="btn-import" id="openImportBtn">+ Smart Builder</button>
    </div>
        <div id="installBanner" class="hidden"></div>

   <div class="w-controls">
      <input type="text" id="searchInput" class="search-input" placeholder="Search artist or song..." />
      <div class="tabs">
        <button class="tab active" data-tab="All">All</button>
        <button class="tab" data-tab="English">English</button>
        <button class="tab" data-tab="Spanish">Spanish</button>
        <button class="tab" data-tab="By Artist">By Artist</button>
      </div>
    </div>
    <div id="songList"></div>
  </div>
  <div id="playerScreen" class="hidden">
    <div class="p-top">
      <button class="p-song-btn" id="backBtn">Song Title — Artist ▾</button>
      <button class="p-key-pill" id="keyPill" title="Tap to transpose key">Key: G ▾</button>
    </div>
    <div class="p-sec-bar">
      <div id="countdownBox"></div>
      <div class="sec-label" id="secLabel">Intro</div>
    </div>
    <div id="viewport"></div>
    <div class="p-footer">
      <div class="f-row1">
        <button class="btn-play" id="playPauseBtn">Pause</button>
        <button class="btn-restart" id="restartBtn">Restart</button>
        <div class="timer" id="timerDisplay">0:00 / 0:00</div>
        <select class="speed-select" id="speedSelect">
          <option value="0.75">0.75x</option>
          <option value="1" selected>1x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
        </select>
      </div>
      <div class="f-row2" id="secJumper"></div>
    </div>
  </div>
  <div id="importModal" class="hidden"></div>
  <div id="chordModal" class="hidden"></div>

</div>
<script src="songs.js"></script>
<script>
(function() {
  var custom = JSON.parse(localStorage.getItem('custom_teleprompter_songs') || '[]');
  var base = Array.isArray(window.VERIFIED_SONGS) ? window.VERIFIED_SONGS : [];
  var ALL_SONGS = base.concat(custom);
  var activeTab = 'All', searchQuery = '', expandedArtist = null;
  var currentSong = null, parsedRows = [], sections = [], isPlaying = false, elapsed = 0, speed = 1, lastTick = null;
  var transposeSteps = 0;

  var NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  var FLAT_MAP = { 'Db':'C#','Eb':'D#','Gb':'F#','Ab':'G#','Bb':'A#' };
  var TARGET_KEYS = ['Original', 'G Major', 'A Major', 'D Major', 'E Major'];
  var targetIdx = 0;

  function rootToIdx(root) {
    return NOTES.indexOf(FLAT_MAP[root] || root);
  }
  function transposeChord(chord, steps) {
    if (!steps) return chord;
    return chord.replace(/^([A-G][#b]?)(.*)$/, function(_, root, suffix) {
      var idx = rootToIdx(root);
      if (idx === -1) return chord;
      return NOTES.at((idx + steps + 120) % 12) + suffix;
    });
  }
  function getStepsForTarget(origKey, targetKey) {
    if (!targetKey || targetKey === 'Original') return 0;
    var r1 = (origKey || 'G').split(' ').at(0);
    var r2 = targetKey.split(' ').at(0);
    var i1 = rootToIdx(r1), i2 = rootToIdx(r2);
    if (i1 === -1 || i2 === -1) return 0;
    return (i2 - i1 + 12) % 12;
  }

  var welcomeScreen = document.getElementById('welcomeScreen');
  var playerScreen = document.getElementById('playerScreen');
  var songList = document.getElementById('songList');
  var searchInput = document.getElementById('searchInput');
  var songCountSub = document.getElementById('songCountSub');

  function fmtTime(sec) {
    sec = Math.max(0, Math.floor(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  function parseDuration(str) {
    var p = (str || '3:00').split(':');
    return (parseInt(p.at(0), 10) || 0) * 60 + (parseInt(p.at(1), 10) || 0);
  }
  function sortSongs(list) {
    return list.slice().sort(function(a, b) {
      if (a.lang !== b.lang) return a.lang.localeCompare(b.lang);
      var sa = a.sort || a.artist, sb = b.sort || b.artist;
      return sa !== sb ? sa.localeCompare(sb) : a.title.localeCompare(b.title);
    });
  }
  function renderList() {
    var q = searchQuery.trim().toLowerCase();
    var filtered = sortSongs(ALL_SONGS).filter(function(s) {
      if (activeTab === 'English' && s.lang !== 'English') return false;
      if (activeTab === 'Spanish' && s.lang !== 'Spanish') return false;
      return !q || s.title.toLowerCase().indexOf(q) !== -1 || s.artist.toLowerCase().indexOf(q) !== -1;
    });
    songCountSub.textContent = 'Select a song to start (' + filtered.length + ' Songs)';
    songList.innerHTML = '';
    if (activeTab === 'By Artist') {
      var groups = {};
      filtered.forEach(function(s) { (groups[s.artist] = groups[s.artist] || []).push(s); });
      Object.keys(groups).sort().forEach(function(artist) {
        var wrap = document.createElement('div'); wrap.className = 'artist-group';
        var head = document.createElement('div'); head.className = 'artist-header';
        var nm = document.createElement('span'); nm.className = 'artist-name'; nm.textContent = artist;
        var ct = document.createElement('span'); ct.className = 'artist-count'; ct.textContent = groups[artist].length;
        head.appendChild(nm); head.appendChild(ct);
        head.onclick = function() { expandedArtist = expandedArtist === artist ? null : artist; renderList(); };
        wrap.appendChild(head);
        if (expandedArtist === artist || q) {
          var sub = document.createElement('div'); sub.className = 'artist-songs';
          groups[artist].forEach(function(song) { sub.appendChild(makeSongItem(song)); });
          wrap.appendChild(sub);
        }
        songList.appendChild(wrap);
      });
    } else {
      filtered.forEach(function(song) { songList.appendChild(makeSongItem(song)); });
    }
  }
  function makeSongItem(song) {
    var div = document.createElement('div'); div.className = 'song-item';
    var left = document.createElement('div');
    var t = document.createElement('div'); t.className = 'song-title'; t.textContent = song.title;
    var a = document.createElement('div'); a.className = 'song-artist'; a.textContent = song.artist;
    left.appendChild(t); left.appendChild(a);
    var meta = document.createElement('div'); meta.className = 'song-meta';
    var bl = document.createElement('span'); bl.className = 'badge-lang'; bl.textContent = song.lang === 'English' ? 'EN' : 'ES';
    var bk = document.createElement('span'); bk.className = 'badge-key'; bk.textContent = song.key.replace(' Major', '');
    meta.appendChild(bl); meta.appendChild(bk);
    div.appendChild(left); div.appendChild(meta);
    div.onclick = function() { launchSong(song); };
    return div;
  }
  function parseSongData(song) {
    var totalSec = parseDuration(song.duration);
    var lines = song.body.trim().split('\n').map(function(l) { return l.trim(); }).filter(Boolean);
    var rawSecs = []; var curSec = null;
    lines.forEach(function(line) {
      var m = line.match(/^\[(\d+):(\d+)\]\s*(.+)$/);
      if (m) {
        var t = parseInt(m.at(1), 10) * 60 + parseInt(m.at(2), 10);
        var rest = m.at(3);
        if (rest.indexOf('|') !== -1) {
          var parts = rest.split('|');
          curSec = { name: parts.at(0).trim(), start: t, rows: [{ text: '[ Instrumental ]', chords: parts.at(1).trim().split(/\s*-\s*/), isInst: true }] };
        } else {
          curSec = { name: rest.trim(), start: t, rows: [] };
        }
        rawSecs.push(curSec);
      } else if (curSec) {
        var chords = [];
        var cleanText = line.replace(/\(([^)]+)\)/g, function(_, c) { if (chords.indexOf(c) === -1) chords.push(c); return ''; }).replace(/\s+/g, ' ').trim();
        curSec.rows.push({ text: cleanText, chords: chords, isInst: false });
      }
    });
    var rows = [];
    rawSecs.forEach(function(sec, idx) {
      var nextStart = idx + 1 < rawSecs.length ? rawSecs.at(idx + 1).start : totalSec;
      var span = Math.max(2, nextStart - sec.start);
      var perRow = span / Math.max(1, sec.rows.length);
      sec.rows.forEach(function(r, rIdx) {
        rows.push({ time: sec.start + rIdx * perRow, section: sec.name, text: r.text, chords: r.chords, isInst: r.isInst });
      });
    });
    return { totalSec: totalSec, rows: rows, sections: rawSecs };
  }
  function updateKeyPill() {
    if (!currentSong) return;
    var activeKey = targetIdx === 0 ? currentSong.key : TARGET_KEYS.at(targetIdx);
    document.getElementById('keyPill').textContent = 'Key: ' + activeKey.replace(' Major', '') + ' ▾';
  }
  function launchSong(song) {
    currentSong = song;
    targetIdx = 0;
    transposeSteps = 0;
    var parsed = parseSongData(song);
    parsedRows = parsed.rows; sections = parsed.sections; currentSong.totalSec = parsed.totalSec;
    elapsed = 0; isPlaying = true; lastTick = performance.now();
    document.getElementById('backBtn').textContent = song.title + ' — ' + song.artist + ' ▾';
    updateKeyPill();
    document.getElementById('playPauseBtn').textContent = 'Pause';
    welcomeScreen.classList.add('hidden'); playerScreen.classList.remove('hidden');
    renderPlayer();
  }
  function renderPlayer() {
    if (!currentSong) return;
    var activeIdx = 0;
    for (var i = 0; i < parsedRows.length; i++) { if (elapsed >= parsedRows.at(i).time) activeIdx = i; else break; }
    var activeRow = parsedRows.at(activeIdx) || { section: 'Intro', isInst: false };
    document.getElementById('secLabel').textContent = activeRow.section;
    var cdBox = document.getElementById('countdownBox'); cdBox.innerHTML = '';
    if (activeRow.isInst && activeRow.section.toLowerCase().indexOf('intro') !== -1) {
      var firstVocal = parsedRows.find(function(r) { return !r.isInst; });
      var rem = firstVocal ? Math.max(1, Math.ceil(firstVocal.time - elapsed)) : 0;
      if (rem > 0) {
        var pill = document.createElement('span'); pill.className = 'countdown-pill';
        pill.textContent = '• Vocals in ' + rem + 's'; cdBox.appendChild(pill);
      }
    }
    var vp = document.getElementById('viewport'); vp.innerHTML = '';
    parsedRows.slice(activeIdx, activeIdx + 4).forEach(function(r, idx) {
      var rowEl = document.createElement('div'); rowEl.className = 'row op-' + idx;
      var bar = document.createElement('div'); bar.className = idx === 0 ? 'active-bar' : 'active-bar spacer';
      var content = document.createElement('div'); content.className = 'row-content';
      var txt = document.createElement('div'); txt.className = 'lyric-text'; txt.textContent = r.text;
      content.appendChild(txt);
      if (r.chords && r.chords.length) {
        var cr = document.createElement('div'); cr.className = 'chord-row';
        r.chords.forEach(function(c) {
          var p = document.createElement('span'); p.className = 'chord-pill';
          p.textContent = transposeChord(c, transposeSteps);
          cr.appendChild(p);
        });
        content.appendChild(cr);
      }
      rowEl.appendChild(bar); rowEl.appendChild(content); vp.appendChild(rowEl);
    });
    document.getElementById('timerDisplay').textContent = fmtTime(elapsed) + ' / ' + fmtTime(currentSong.totalSec);
    var jumper = document.getElementById('secJumper'); jumper.innerHTML = '';
    var activeSecIdx = 0;
    for (var j = 0; j < sections.length; j++) { if (elapsed >= sections.at(j).start) activeSecIdx = j; }
    sections.forEach(function(sec, idx) {
      var btn = document.createElement('button');
      btn.className = 'sec-pill' + (idx === activeSecIdx ? ' active' : '');
      btn.textContent = sec.name;
      btn.onclick = function() { elapsed = sec.start; lastTick = performance.now(); renderPlayer(); };
      jumper.appendChild(btn);
    });
    var activePill = jumper.children.item(activeSecIdx);
    if (activePill) activePill.scrollIntoView({ behavior: 'smooth', inline: 'start', block: 'nearest' });
  }
  function tick(now) {
    if (isPlaying && currentSong) {
      if (lastTick !== null) {
        elapsed += ((now - lastTick) / 1000) * speed;
        if (elapsed >= currentSong.totalSec) { elapsed = currentSong.totalSec; isPlaying = false; document.getElementById('playPauseBtn').textContent = 'Play'; }
        renderPlayer();
      }
      lastTick = now;

  function autoFormatBody(raw, durStr) {
    if (/^\[\d+:\d+\]/m.test(raw)) return raw;
    var total = parseDuration(durStr || '3:15');
    var lines = raw.split('\n').map(function(l) { return l.trim(); }).filter(Boolean);
    var blocks = [], cur = { name: 'Verse 1', lines: [] };
    lines.forEach(function(l) {
      var sm = l.match(/^\[([^\]]+)\]$/);
      if (sm) {
        if (cur.lines.length) blocks.push(cur);
        cur = { name: sm.at(1), lines: [] };
      } else { cur.lines.push(l); }
    });
    if (cur.lines.length) blocks.push(cur);
    if (!blocks.length) return '[0:00] Verse 1\n' + raw;
    var step = Math.max(8, Math.floor(total / blocks.length));
    return blocks.map(function(b, idx) {
      var t = idx * step;
      return '[' + fmtTime(t) + '] ' + b.name + '\n' + b.lines.join('\n');
    }).join('\n');
  }

    var CHORD_SHAPES = {

    'D':  { s: '-1,-1,0,2,3,2', f: ',,,1,3,2', tip: 'Mute E & A; index (1) on G2, ring (3) on B3, middle (2) on high E2' },
    'D7': { s: '-1,-1,0,2,1,2', f: ',,,2,1,3', tip: 'Mute E & A; middle (2) on G2, index (1) on B1, ring (3) on high E2' },
    'A':  { s: '-1,0,2,2,2,0', f: ',,1,2,3,', tip: 'Mute low E; fingers 1, 2, 3 stacked on 2nd fret of D, G, B' },
    'A7': { s: '-1,0,2,0,2,0', f: ',,2,,3,', tip: 'Mute low E; middle (2) on D2, ring (3) on B2, open G string' },
    'E':  { s: '0,2,2,1,0,0', f: ',2,3,1,,', tip: 'Middle (2) on A2, ring (3) on D2, index (1) on G1; strum all 6' },
    'E7': { s: '0,2,0,1,0,0', f: ',2,,1,,', tip: 'Middle (2) on A2, index (1) on G1, open D string; strum all 6' },
    'B7': { s: '-1,2,1,2,0,2', f: ',2,1,3,,4', tip: 'Mute low E; A2 (2), D1 (1), G2 (3), open B, high E2 (4)' }
  };

  var chordModal = document.getElementById('chordModal');

     function showChordDiagram(name) {
    var info = CHORD_SHAPES[name];
    if (!info) return;
    wasPlayingBeforeChord = isPlaying;
    if (isPlaying) {
      isPlaying = false;
      document.getElementById('playPauseBtn').textContent = 'Play';
    }
    var frets = info.s.split(','), fingers = info.f.split(',');

    var board = document.createElement('div');
    board.style.cssText = 'background:#020617;border:1px solid #334155;border-radius:12px;padding:12px 14px 14px;margin:8px auto 0;width:210px;';

    var topRow = document.createElement('div');
    topRow.style.cssText = 'display:grid;grid-template-columns:repeat(6,1fr);margin-bottom:4px;';
    for (var s = 0; s < 6; s++) {
      var v = parseInt(frets.at(s), 10);
      var mk = document.createElement('div');
      mk.style.cssText = 'text-align:center;font-size:13px;font-weight:800;color:' + (v < 0 ? '#EF4444' : v === 0 ? '#38BDF8' : 'transparent') + ';';
      mk.textContent = v < 0 ? 'X' : v === 0 ? 'O' : '·';
      topRow.appendChild(mk);
    }
    board.appendChild(topRow);

    var grid = document.createElement('div');
    grid.style.cssText = 'border-top:5px solid #F8FAFC;position:relative;';
    for (var f = 1; f <= 4; f++) {
      var fRow = document.createElement('div');
      fRow.style.cssText = 'display:grid;grid-template-columns:repeat(6,1fr);height:36px;border-bottom:2px solid #334155;position:relative;';
      for (var c = 0; c < 6; c++) {
        var cell = document.createElement('div');
        cell.style.cssText = 'position:relative;display:flex;align-items:center;justify-content:center;';
        var strLine = document.createElement('div');
        strLine.style.cssText = 'position:absolute;top:0;bottom:0;left:50%;width:' + (c < 3 ? '2px' : '1.5px') + ';background:#64748B;transform:translateX(-50%);';
        cell.appendChild(strLine);

        if (parseInt(frets.at(c), 10) === f) {
          var dot = document.createElement('div');
          dot.style.cssText = 'position:relative;z-index:2;width:24px;height:24px;border-radius:50%;background:#2563EB;border:2px solid #FACC15;color:#FFFFFF;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;';
          dot.textContent = fingers.at(c) || '';
          cell.appendChild(dot);
        }
        fRow.appendChild(cell);
      }
      grid.appendChild(fRow);
    }
    board.appendChild(grid);

    chordModal.innerHTML = '';
    var card = document.createElement('div'); card.className = 'c-card';
    var title = document.createElement('div'); title.className = 'c-title'; title.textContent = name + ' Chord';
    var sub = document.createElement('div'); sub.className = 'c-sub'; sub.textContent = info.tip;
    var btn = document.createElement('button'); btn.className = 'c-close';
    btn.textContent = wasPlayingBeforeChord ? 'Got it / Resume' : 'Close';
    btn.onclick = closeChordModal;
    card.appendChild(title); card.appendChild(sub); card.appendChild(board); card.appendChild(btn);
    chordModal.appendChild(card);
    chordModal.classList.remove('hidden');
  }

 renderList(); requestAnimationFrame(tick);
